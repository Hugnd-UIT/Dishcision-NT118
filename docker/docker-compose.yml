version: "3.8"

services:
  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: dishcision-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-db}
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dishcision-net

  # Redis
  redis:
    image: redis:7-alpine
    container_name: dishcision-redis
    restart: unless-stopped
    env_file:
      - ../.env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-secret}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 150M
          cpus: "0.30"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dishcision-net

  # Backend
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    container_name: dishcision-backend
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-db}?schema=public&connection_limit=15
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
      NODE_OPTIONS: "--max-old-space-size=384"
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - dishcision-net

  # Frontend
  frontend:
    build:
      context: ../frontend/web-admin
      dockerfile: Dockerfile
    container_name: dishcision-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: "0.30"
    networks:
      - dishcision-net

volumes:
  postgres-data:
  redis-data:

networks:
  dishcision-net:
    driver: bridge
